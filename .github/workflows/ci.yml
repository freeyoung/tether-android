name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history: the version code is the number of commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android platform and NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370" > /dev/null

      - name: Test the engine bridge
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet .
          go test -race .

      # The build runs scripts/build-native.sh first.
      - name: Build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
